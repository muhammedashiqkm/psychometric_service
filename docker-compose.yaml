version: '3.8'

services:
  api:
    build: .
    container_name: psychometry_service
    # Published and listened on from the same .env value, so the address the
    # portal is configured with is the address the service answers on.
    ports:
      - "${PORT:-5010}:${PORT:-5010}"
    volumes:
      - ./logs:/code/logs
    env_file:
      - .env
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-5010}/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s